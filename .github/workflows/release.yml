name: Windows EXE and release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci --prefix editor
      - run: npm run build --prefix editor
      - name: Bundle Microsoft-signed Evergreen setup
        shell: pwsh
        run: ./tools/prepare-webview-bootstrapper.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Moji.Tests -c Release
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Moji.App/Moji.App.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match the application version.' }
      - name: Publish standalone native Windows app
        shell: pwsh
        run: |
          dotnet publish src/Moji.App -c Release -r win-x64 --self-contained true -p:MojiWebViewBootstrapper="$pwd/webview-bootstrapper/MicrosoftEdgeWebview2Setup.exe" -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Moji.App -c Release -r win-arm64 --self-contained true -p:MojiWebViewBootstrapper="$pwd/webview-bootstrapper/MicrosoftEdgeWebview2Setup.exe" -o publish/win-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($arch in @('x64','arm64')) {
            if ((Get-Item publish/win-$arch/Moji.Notes.exe).Length -gt 100MB) { throw 'Standard EXE unexpectedly exceeds 100 MiB.' }
          }
      - name: Native WPF smoke test
        env:
          MOJI_FORCE_WEBVIEW_BOOTSTRAP: 1
        shell: pwsh
        run: |
          $p = Start-Process publish/win-x64/Moji.Notes.exe -ArgumentList '--smoke-test', '--output', "$pwd/artifacts/smoke" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Native smoke test failed: $($p.ExitCode)" }
          Get-Content artifacts/smoke/report.json
      - name: Verify ordinary launch without installing components
        shell: pwsh
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process publish/win-x64/Moji.Notes.exe -ArgumentList '--smoke-test', '--output', "$pwd/artifacts/standard-smoke" -PassThru
          $workspace = "$pwd/artifacts/standard-smoke/01-workspace.png"
          while (!(Test-Path $workspace) -and !$p.HasExited -and $clock.Elapsed.TotalSeconds -lt 90) { Start-Sleep -Milliseconds 100 }
          $firstWorkspaceMilliseconds = $clock.Elapsed.TotalMilliseconds
          if (!(Test-Path $workspace)) { throw 'Standard package did not reach its workspace.' }
          if (!$p.WaitForExit(120000) -or $p.ExitCode -ne 0) { throw 'Standard launch smoke checks failed.' }
          $report = Get-Content artifacts/standard-smoke/report.json -Raw | ConvertFrom-Json
          if (!$report.success -or $report.bootstrapperInvocations -ne 0 -or $report.hasFixedRuntime) { throw 'Standard launch must reuse Evergreen without running setup.' }
          @{ success = $true; firstWorkspaceMilliseconds = $firstWorkspaceMilliseconds; bootstrapperInvocations = $report.bootstrapperInvocations; note = 'CI machine with Evergreen already installed; not a hardware performance guarantee.' } | ConvertTo-Json | Set-Content artifacts/standard-smoke/launch.json
          Get-Content artifacts/standard-smoke/launch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moji-native-UI
          path: |
            artifacts/smoke/*.png
            artifacts/smoke/report.json
            artifacts/standard-smoke/report.json
            artifacts/standard-smoke/launch.json
      - name: Package portable builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          $version = ([xml](Get-Content src/Moji.App/Moji.App.csproj)).Project.PropertyGroup.Version
          $checksums = @{}
          foreach ($arch in @('x64','arm64')) {
            $name = "Moji-Notes-$version-win-$arch.exe"
            Copy-Item publish/win-$arch/Moji.Notes.exe artifacts/release/$name
            $checksums[$name] = (Get-FileHash artifacts/release/$name -Algorithm SHA256).Hash.ToLower()
            Copy-Item README.md publish/win-$arch/使用说明.md
            Copy-Item LICENSE publish/win-$arch/LICENSE.txt
            Compress-Archive publish/win-$arch/* artifacts/release/Moji-Notes-$version-win-$arch.zip
          }
          $checksums | ConvertTo-Json | Set-Content artifacts/release/SHA256SUMS.json -Encoding utf8
          git archive --format=zip --output="artifacts/release/Moji-Notes-$version-source.zip" HEAD
          Copy-Item artifacts/smoke/01-workspace.png artifacts/release/Moji-Workspace.png
          Copy-Item artifacts/smoke/02-editor.png artifacts/release/Moji-Editor.png
          Copy-Item artifacts/smoke/05-dark.png artifacts/release/Moji-Dark.png
          Copy-Item artifacts/smoke/report.json artifacts/release/native-test-report.json
          Copy-Item artifacts/standard-smoke/report.json artifacts/release/native-standard-test-report.json
          Copy-Item artifacts/standard-smoke/launch.json artifacts/release/standard-launch-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moji-native-Windows
          path: artifacts/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/Moji.App/Moji.App.csproj)).Project.PropertyGroup.Version
          $tag = "v$version"
          $files = (Get-ChildItem artifacts/release/*).FullName
          gh release create $tag @files --target $env:GITHUB_SHA --title "墨记 $tag" --notes-file docs/RELEASE.md
