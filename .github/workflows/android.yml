name: Android native build and adaptive tests
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Load publisher signing key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MOJI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$MOJI_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moji-android-release.p12"
            chmod 600 "$RUNNER_TEMP/moji-android-release.p12"
            printf 'MOJI_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/moji-android-release.p12" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
        env:
          MOJI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moji-Android-build
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/tests/
            android/app/build/test-results/
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native phone, tablet and desktop-window UI checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Download/moji-native-ui ../android-ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moji-Android-native-UI
          path: |
            android-ui-screenshots/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
      - name: Publish signed Android release
        if: (startsWith(github.ref, 'refs/tags/android-v') || contains(github.event.head_commit.message, '[android-release]')) && env.MOJI_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          mkdir -p ../artifacts/android-release
          cp app/build/outputs/apk/release/app-release.apk "../artifacts/android-release/Moji-Notes-Android-$version.apk"
          cp ../android-ui-screenshots/*.png ../artifacts/android-release/ 2>/dev/null || true
          git -C .. archive --format=zip --output="artifacts/android-release/Moji-Notes-Android-$version-source.zip" HEAD
          sha256sum "../artifacts/android-release/Moji-Notes-Android-$version.apk" > ../artifacts/android-release/SHA256SUMS.txt
          gh release create "android-v$version" ../artifacts/android-release/* --target "$GITHUB_SHA" --title "墨记 Android $version" --notes-file README.md
