name: Android native build and adaptive tests
on:
  push:
    branches: [main]
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moji-Android-build
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/tests/
            android/app/build/test-results/
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native phone, tablet and desktop-window UI checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon
            adb pull /sdcard/Android/data/app.moji.android.debug/files/screenshots ../android-ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moji-Android-native-UI
          path: |
            android-ui-screenshots/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
