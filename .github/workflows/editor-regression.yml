name: Verify published Android editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: |
          mkdir -p android/app/build/outputs/apk/release
          curl -fsSL https://github.com/piayboy894/moji-notes/releases/download/android-v1.1.0/Moji-Notes-Android-1.1.0.apk -o android/app/build/outputs/apk/release/app-release.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: python3 tools/release-editor-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-editor-results
          path: android/app/build/outputs/editor-smoke/
