name: Deliver verified Android 2.4.1
on:
  push:
    paths: ['.github/workflows/deliver-android-241.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: deliver-verified-android-241
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Await the exact tested package and request gated publication
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          repo = 'piayboy894/moji-notes'
          endpoint = f'repos/{repo}/actions/runs/43836332475'
          for attempt in range(72):
              data = json.loads(subprocess.check_output(['gh','api',endpoint], text=True))
              if data['head_sha'] != '0066d7430279a8065ef94150a8afd048c4d2f972' or data['path'] != '.github/workflows/android.yml' or data['head_branch'] != 'main':
                  raise RuntimeError('Unexpected build provenance')
              if data['status'] == 'completed':
                  if data['conclusion'] != 'success':
                      raise RuntimeError('Native or signed installation checks did not pass')
                  break
              time.sleep(15)
          else:
              raise RuntimeError('Timed out waiting for native checks')
          request = {'ref':'main','inputs':{'platform':'android','run_id':'43836332475','replace_existing':'false'}}
          subprocess.run(['gh','api',f'repos/{repo}/actions/workflows/publish-tested.yml/dispatches','--method','POST','--input','-'], input=json.dumps(request), text=True, check=True)
          print('Requested publication of the exact successful tested Android artifact.')
          PY
